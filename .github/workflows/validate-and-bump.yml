name: Validate Bank Assets & Bump SW Cache

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate question banks, cases, and image paths
        run: |
          python3 - << 'PY'
          import json, os, glob

          bank_files = glob.glob("**/question-bank.json", recursive=True)
          assert bank_files, "No question-bank.json files found"

          all_question_ids = set()
          errors = []

          for bank_path in bank_files:
              base_dir = os.path.dirname(bank_path)
              with open(bank_path, "r", encoding="utf-8") as f:
                  data = json.load(f)

              questions = data.get("questions", [])
              cases = data.get("cases", [])
              local_ids = set()

              for q in questions:
                  qid = q.get("question_id", "<missing>")
                  if qid in all_question_ids:
                      errors.append(f"{bank_path}: Duplicate question_id '{qid}'")
                  all_question_ids.add(qid)
                  local_ids.add(qid)

                  options = q.get("options", [])
                  cidx = q.get("correct_index")
                  if not isinstance(cidx, int) or not (0 <= cidx < len(options)):
                      errors.append(f"{bank_path} ({qid}): Invalid correct_index {cidx}")

                  for field in ("image", "zoom_image", "original_image"):
                      rel = q.get(field)
                      if rel and not rel.startswith(("http://", "https://", "data:")):
                          resolved = os.path.normpath(os.path.join(base_dir, rel))
                          if not os.path.exists(resolved) and not os.path.exists(rel.lstrip("./")):
                              errors.append(f"{bank_path} ({qid}): Missing {field} '{rel}'")

                  for pics in (q.get("choice_images") or {}).values():
                      for pic in pics or []:
                          rel = pic.get("image")
                          if rel and not rel.startswith(("http://", "https://", "data:")):
                              resolved = os.path.normpath(os.path.join(base_dir, rel))
                              if not os.path.exists(resolved) and not os.path.exists(rel.lstrip("./")):
                                  errors.append(f"{bank_path} ({qid}): Missing choice_image '{rel}'")

              for case in cases:
                  cid = case.get("case_id", "<missing>")
                  for qid in case.get("question_ids", []):
                      if qid not in local_ids:
                          errors.append(f"{bank_path} (case {cid}): Unknown question_id '{qid}'")

          if errors:
              print("Validation failed:")
              for err in errors:
                  print(" -", err)
              raise SystemExit(1)

          print(f"Validated {len(bank_files)} bank(s) and {len(all_question_ids)} unique questions successfully.")
          PY

      - name: Stamp sw.js cache name with commit SHA on main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          sed -i "s/const CACHE_NAME = 'rpq-offline-[^']*';/const CACHE_NAME = 'rpq-offline-${SHORT_SHA}';/" sw.js
          if ! git diff --quiet sw.js; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add sw.js
            git commit -m "chore: bump sw.js cache to rpq-offline-${SHORT_SHA} [skip ci]"
            git push
          fi
